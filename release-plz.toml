[workspace]
git_only = true
publish = false
git_release_enable = false
git_tag_enable = true
git_tag_name = "{{ package }}-v{{ version }}"
release_always = false
pr_branch_prefix = "release-plz-"
# Every member inherits workspace.package.version, including private tools.
release = true
changelog_update = false
# The unreleased 0.0.x line advances by patch even for breaking commits.
semver_check = false
features_always_increment_minor = false
dependencies_update = false
max_analyze_commits = 3000

# The crates that go to crates.io (docs/releasing.md). They leave git-only mode,
# so release-plz reads their latest version from the registry, and publish.
# Every other member stays git-only and is only tagged.
[[package]]
name = "raikiri-style"
git_only = false
publish = true

[[package]]
name = "raikiri-layout-geometry"
git_only = false
publish = true

[[package]]
name = "raikiri-traits"
git_only = false
publish = true

[[package]]
name = "raikiri-layout-style"
git_only = false
publish = true

[[package]]
name = "raikiri-svg"
git_only = false
publish = true

[[package]]
name = "raikiri-net"
git_only = false
publish = true

[[package]]
name = "raikiri-dom"
git_only = false
publish = true

[[package]]
name = "raikiri-html"
git_only = false
publish = true
