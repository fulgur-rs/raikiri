[workspace]
resolver = "3"
members = [
    "crates/raikiri-traits",
    "crates/raikiri-style",
    "crates/raikiri-net",
    "crates/raikiri-dom",
    "crates/raikiri-html",
    "crates/raikiri-paint",
    "crates/raikiri",
    "crates/raikiri-blitz-compat",
    "crates/raikiri-wpt",
    "crates/raikiri-vrt",
    "crates/raikiri-bench",
    "crates/raikiri-js",
]

[workspace.package]
edition = "2024"
rust-version = "1.89.0"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
# ── In-repo (populated per crate as they land in Tasks 2–6) ────────────
raikiri-traits       = { version = "0.2.0", path = "./crates/raikiri-traits" }
raikiri-style        = { version = "0.1.0", path = "./crates/raikiri-style" }
raikiri-net          = { version = "0.1.0", path = "./crates/raikiri-net" }
raikiri-dom          = { version = "0.1.0", path = "./crates/raikiri-dom" }
raikiri-html         = { version = "0.1.0", path = "./crates/raikiri-html" }
raikiri-paint        = { version = "0.1.0", path = "./crates/raikiri-paint" }
raikiri              = { version = "0.1.0", path = "./crates/raikiri" }
raikiri-blitz-compat = { version = "0.1.0", path = "./crates/raikiri-blitz-compat" }
raikiri-wpt          = { version = "0.1.0", path = "./crates/raikiri-wpt" }
raikiri-vrt          = { version = "0.1.0", path = "./crates/raikiri-vrt" }
raikiri-js           = { version = "0.1.0", path = "./crates/raikiri-js" }

# ── Servo (cssparser + selectors) ──────────────────────────────────────
cssparser = "0.37"
selectors = "0.39"

# ── HTML5ever ──────────────────────────────────────────────────────────
html5ever   = "0.39"
markup5ever = "0.40"

# ── Layout (taffy) ─────────────────────────────────────────────────────
taffy = { version = "0.14", default-features = false, features = [
    "std",
    "flexbox",
    "grid",
    "block_layout",
    "content_size",
    "calc",
    "float_layout",
] }

# ── Text (parley) ──────────────────────────────────────────────────────
parley = { version = "0.11", default-features = false, features = ["std", "system"] }

# ── Rendering (anyrender + peniko + kurbo) ─────────────────────────────
anyrender = "0.13"
peniko    = "0.6"
kurbo     = "0.13"

# ── Utility crates ─────────────────────────────────────────────────────
smol_str   = "0.3"
rustc-hash = "2.1"
bytes      = "1"
url        = "2.5"

# ── Image decode (Pure Rust) ────────────────────────────────────────────
# raikiri-net's ImageResolver decodes fetched or data: <img> bytes to raw
# RGBA8 pixels. Keep the format set explicit so the dependency remains
# deterministic and WASM-friendly.
image = { version = "0.25", default-features = false, features = ["gif", "jpeg", "png", "webp"] }
data-url = "0.3"
png = "0.18"

# Pure-Rust WOFF/WOFF2 decompression for @font-face resources.
wuff = "0.2.9"

# ── Date/time (validate-expectations lint, raikiri-spike-yps) ──────────
time = { version = "0.3", default-features = false, features = ["std", "parsing", "macros"] }

# ── Dev-only: VRT rasterizer / snapshot / oracle ───────────────────────
anyrender_vello_cpu = { version = "0.16", features = ["multithreading"] }
vello_cpu           = "0.1"                      # m1.18 thread-pin test; RenderContext::new_with(RenderSettings::num_threads)
tiny-skia           = "0.11"
insta               = "1"
blitz-traits        = "=0.3.0-beta.2"
blitz-html          = "=0.3.0-beta.2"
blitz-dom           = "=0.3.0-beta.2"
blitz-paint         = "=0.3.0-beta.2"

# ── Dev-only: lint fixtures + bin tests (raikiri-spike-yps) ────────────
tempfile   = "3"
assert_cmd = "2"

# ── Dev-only: benchmarking (raikiri-spike-zpui origin, promoted here by
# raikiri-spike-vvf6 now that a second crate — raikiri-bench — legitimately
# grows a `[[bench]]` target; raikiri-style/Cargo.toml documented this exact
# promotion trigger in advance: "Promote only when a second crate legitimately
# grows a bench, same posture as precomputed-hash"). Single source of truth
# for the version pin + Pure Rust rationale now lives here instead of being
# duplicated per crate — the writeup below is carried over verbatim from
# raikiri-style/Cargo.toml (pre-vvf6), not summarized, per that comment's own
# "regenerate できない情報なので manifest に残す" note.
#
# `default-features = false` drops `plotters` (+ its `chrono`/`image` tail) and
# `rayon`; `cargo_bench_support` is the one feature required for `cargo bench`
# to drive the harness.
#
# **Pinned below 0.8 on purpose** (autonomy.md 原則 5, Pure Rust must):
# criterion 0.8 gained a `[target."cfg(any(windows, unix))".dependencies]` edge
# on `alloca`, which ships an `alloca.c` compiled through `cc` at build time.
# That is a C compilation step in the build graph — walls.md wall 7's
# "Non-Pure-Rust dep 追加" trigger — and 0.7.0 is the pure-Rust alternative that
# 原則 5 requires us to prefer when one exists. Measured on this workspace:
# 0.7.0 adds 22 packages with no `cc` and no `alloca`; 0.8.2 adds 30 including
# both. **Do not bump to 0.8+ without a wall/build escalation.**
#
# ── 原則 5 Pure Rust / WASM readiness ──────────────────────────────────
#
# walls.md 壁 7 の判定原則が crate-local dev-dep にも Pure Rust / WASM check を
# 必須としているので、"dev-only だから" は check を省く理由にならない。以下は
# 実施した check の結論と、再実行できる形の evidence (raikiri-spike-zpui、
# raikiri-style/benches/cascade.rs 経由で検証済み)。
#
#   rustup target add wasm32-unknown-unknown
#   cargo check -p raikiri-style --all-targets --target wasm32-unknown-unknown
#   → Finished
#
# これは `benches/cascade.rs` を wasm32 向けに compile する。追加 22 package の
# 内訳は **19 が wasm32 で compile / 1 は host proc-macro (`zerocopy-derive`) /
# 2 はどの target の graph にも入らない (`aho-corasick`、`crunchy`)**。
# compile に失敗する package は 1 つも無い。
#
# したがって walls.md 壁 7 Trigger の "WASM dead-end dep 追加 (WASM 未対応 かつ
# 代替なし)" は **第 1 連言が成立しない**ため発火しない (代替も divan / tango 等が
# 実在する)。22 package 個別の根拠は bd raikiri-spike-zpui に記録した —
# ここに列挙すると 0.7.x の dep tree が動くたびに lockfile と食い違う。
#
# 注意して読むべき点 (regenerate できない情報なので manifest に残す):
#
# - `criterion` は wasm32 で **compile は通るが動かない**。`std::time::Instant`
#   (`src/bencher.rs`) と `std::fs` (`src/fs.rs`) が wasm32-unknown-unknown に
#   実装されていないため。bench は host で回す前提。
# - `default-features = false` は **plot を無効化しない**。`plotters` を落とすと
#   pure Rust の backend が消えるだけで、`gnuplot` が PATH にあれば
#   `PlottingBackend::Gnuplot` に解決し、`criterion-plot` が
#   `Command::new("gnuplot")` で **外部 native binary を起動する**
#   (`criterion/src/lib.rs` の `default_plotting_backend`、`criterion-plot/src/lib.rs`)。
#   gnuplot 不在なら `PlottingBackend::None` に落ちるだけなので build graph に
#   C binding も native link も入らず壁 7 Trigger 1 は発火しないが、
#   「plot は無効」ではない。
# - criterion の runtime OS surface は Instant / fs だけではない —
#   `Command::new($CARGO) metadata` (CARGO_TARGET_DIR 未設定時)、
#   `TcpStream::connect` (cargo-criterion 連携、`CARGO_CRITERION_PORT`)、
#   `process::exit` も持つ。いずれも dev-dependency の bench harness 内。
#
# raikiri-bench (raikiri-spike-vvf6) の追加時点で再確認: `cargo tree -p
# raikiri-bench -e normal,build,dev` に `alloca` / `cc` は出現せず、上記の
# 判断は raikiri-bench にもそのまま適用できる。raikiri-bench 自体の
# wasm32-unknown-unknown check は実施していない — bench-only / host-only
# crate であり (raikiri-vrt / raikiri-wpt と同じ posture、いずれも wasm32
# check を持たない)、そのものが WASM 対象 surface に入らないため。この
# 判断が甘いと思う場合は raikiri-spike-vvf6 に追記して再検討すること。
criterion = { version = "0.7", default-features = false, features = [
    "cargo_bench_support",
] }

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
# M1 以降で必要に応じて拡張。M0 では空のまま resolver="3" 挙動の確認に集中
