[workspace]
resolver = "3"
exclude = ["tools/raikiri-js-wasmtime"]
members = [
    "crates/raikiri-traits",
    "crates/raikiri-svg",
    "crates/raikiri-style",
    "crates/raikiri-net",
    "crates/raikiri-dom",
    "crates/raikiri-html",
    "crates/raikiri-paint",
    "crates/raikiri",
    "crates/raikiri-wpt",
    "crates/raikiri-vrt",
    "crates/raikiri-bench",
    "crates/raikiri-js",
]

[workspace.package]
edition = "2024"
rust-version = "1.89.0"
license = "MIT OR Apache-2.0"
repository = "https://github.com/fulgur-rs/raikiri"

[workspace.dependencies]
# ── In-repo (populated per crate as they land in Tasks 2–6) ────────────
raikiri-traits       = { version = "0.2.0", path = "./crates/raikiri-traits" }
raikiri-svg          = { version = "0.1.0", path = "./crates/raikiri-svg" }
raikiri-style        = { version = "0.1.0", path = "./crates/raikiri-style" }
raikiri-net          = { version = "0.1.0", path = "./crates/raikiri-net" }
raikiri-dom          = { version = "0.1.0", path = "./crates/raikiri-dom" }
raikiri-html         = { version = "0.1.0", path = "./crates/raikiri-html" }
raikiri-paint        = { version = "0.1.0", path = "./crates/raikiri-paint" }
raikiri              = { version = "0.1.0", path = "./crates/raikiri" }
raikiri-wpt          = { version = "0.1.0", path = "./crates/raikiri-wpt" }
raikiri-vrt          = { version = "0.1.0", path = "./crates/raikiri-vrt" }
raikiri-js           = { version = "0.1.0", path = "./crates/raikiri-js" }

# ── Servo (cssparser + selectors) ──────────────────────────────────────
cssparser = "0.37"
selectors = "0.40"
simplecss = "=0.2.2"

# ── HTML5ever ──────────────────────────────────────────────────────────
html5ever   = "0.40"
markup5ever = "0.40"

# ── Layout (taffy) ─────────────────────────────────────────────────────
taffy = { version = "0.14", default-features = false, features = [
    "std",
    "flexbox",
    "grid",
    "block_layout",
    "content_size",
    "calc",
    "float_layout",
    "detailed_layout_info",
] }

# ── Text (shodo) ───────────────────────────────────────────────────────
# Exact pin: the 0.0.x line may change its public API in any release.
shodo  = { version = "=0.0.11", default-features = false, features = ["system-fonts"] }
skrifa = "0.44"

# ── Rendering (anyrender + peniko + kurbo) ─────────────────────────────
anyrender = "0.13"
peniko    = "0.6"
kurbo     = "0.13"

# ── Utility crates ─────────────────────────────────────────────────────
smol_str   = "0.3"
rustc-hash = "2.1"
bytes      = "1"
url        = "2.5"

# ── HTTP client (raikiri-net's SSRF-hardened NetworkProvider) ──────────
# Exact-pinned: `ureq`'s `unversioned::resolver`/`unversioned::transport`
# modules (used for the custom DNS-resolver hook this crate relies on for
# its IP-address safety floor) explicitly do not follow semver and can
# change in a *minor* version bump (see ureq's own `unversioned` module
# doc comment). A caret requirement here could silently pick up a breaking
# change to that surface.
#
# `default-features = ["rustls", "gzip"]` is kept: `rustls` is required for
# `https://` fetches (the overwhelming majority of real resource URLs) and
# `gzip` for real-world compressed CSS/font/image responses. `rustls`'s
# default crypto provider (`ring`) has a `[build-dependencies] cc` edge —
# checked via `cargo tree -e normal,build` against this exact pin — so this
# is a real Non-Pure-Rust build-graph edge (walls.md wall 7's "add a Non-Pure-Rust
# dependency" trigger category). It does not fire the wasm32 half of that
# trigger ("no WASM support and no alternative") because this dependency is `optional
# = true` behind raikiri-net's non-default `http-ureq` feature and is never
# part of a wasm32-unknown-unknown build of this crate's default features.
ureq = "=3.4.2"

# ── Image decode (Pure Rust) ────────────────────────────────────────────
# raikiri-net's ImageResolver decodes fetched or data: <img> bytes to raw
# RGBA8 pixels. Keep the format set explicit so the dependency remains
# deterministic and WASM-friendly.
image = { version = "0.25", default-features = false, features = ["gif", "jpeg", "png", "webp"] }
data-url = "0.3"
png = "0.18"

# ── Static SVG parse + raster (Pure Rust, WASM-forward) ────────────────
# Keep SVG text/font, SVGZ, system-font, and nested raster-image support off.
# The renderer installs its own no-I/O image href resolvers.
resvg = { version = "=0.48.1", default-features = false }
usvg = { version = "=0.48.1", default-features = false }
roxmltree = "0.21.1"

# Pure-Rust WOFF/WOFF2 decompression for @font-face resources.
wuff = "0.2.9"

# ── Date/time (validate-expectations lint, raikiri-spike-yps) ──────────
time = { version = "0.3", default-features = false, features = ["std", "parsing", "macros"] }

# ── Dev-only: VRT rasterizer / snapshot / oracle ───────────────────────
anyrender_vello_cpu = { version = "0.17", features = ["multithreading"] }
vello_cpu           = "0.1"                      # m1.18 thread-pin test; RenderContext::new_with(RenderSettings::num_threads)
tiny-skia           = "0.12"
insta               = "1"
blitz-traits        = "=0.3.0-beta.2"
blitz-html          = "=0.3.0-beta.2"
blitz-dom           = "=0.3.0-beta.2"
blitz-paint         = "=0.3.0-beta.2"

# ── Dev-only: lint fixtures + bin tests (raikiri-spike-yps) ────────────
tempfile   = "3"
assert_cmd = "2"

# ── Dev-only: gzip fixtures for raikiri-net's decompression-bomb test ───
# Already in the build graph through ureq's `gzip` feature; the dev-dep only
# lets the test build a compressed response body. Default backend
# (miniz_oxide) is Pure Rust.
flate2 = "1"

# ── Dev-only: benchmarking (raikiri-spike-zpui origin, promoted here by
# raikiri-spike-vvf6 now that a second crate — raikiri-bench — legitimately
# grows a `[[bench]]` target; raikiri-style/Cargo.toml documented this exact
# promotion trigger in advance: "Promote only when a second crate legitimately
# grows a bench, same posture as precomputed-hash"). Single source of truth
# for the version pin + Pure Rust rationale now lives here instead of being
# duplicated per crate — the writeup below is carried over verbatim from
# raikiri-style/Cargo.toml (pre-vvf6), not summarized, per that comment's own
# "keep non-reproducible information in the manifest" note.
#
# `default-features = false` drops `plotters` (+ its `chrono`/`image` tail) and
# `rayon`; `cargo_bench_support` is the one feature required for `cargo bench`
# to drive the harness.
#
# **Pinned below 0.8 on purpose** (autonomy.md principle 5, Pure Rust must):
# criterion 0.8 gained a `[target."cfg(any(windows, unix))".dependencies]` edge
# on `alloca`, which ships an `alloca.c` compiled through `cc` at build time.
# That is a C compilation step in the build graph — walls.md wall 7's
# "add a Non-Pure-Rust dependency" trigger — and 0.7.0 is the pure-Rust alternative that
# principle 5 requires us to prefer when one exists. Measured on this workspace:
# 0.7.0 adds 22 packages with no `cc` and no `alloca`; 0.8.2 adds 30 including
# both. **Do not bump to 0.8+ without a wall/build escalation.**
#
# ── Principle 5: Pure Rust / WASM readiness ──────────────────────────────────
#
# The walls.md wall 7 rule requires a Pure Rust / WASM check even for a
# crate-local dev dependency: "dev-only" is not an exemption. The results
# and reproducible commands follow (verified in raikiri-spike-zpui via
# raikiri-style/benches/cascade.rs).
#
#   rustup target add wasm32-unknown-unknown
#   cargo check -p raikiri-style --all-targets --target wasm32-unknown-unknown
#   → Finished
#
# This compiles `benches/cascade.rs` for wasm32. Of the 22 added packages,
# **19 compile for wasm32, one is a host proc-macro (`zerocopy-derive`), and
# two do not enter either target's graph (`aho-corasick`, `crunchy`)**.
# No package fails to compile.
#
# Therefore walls.md wall 7's "add a WASM dead-end dependency (no WASM
# support and no alternative)" trigger does not apply: **the first condition
# is false** (alternatives such as divan and tango also exist). Per-package
# evidence for all 22 is in bd raikiri-spike-zpui; listing it here would
# drift from Cargo.lock as the 0.7.x dependency tree changes.
#
# Important details (kept in the manifest because they cannot be regenerated):
#
# - `criterion` **compiles but cannot run** on wasm32: `std::time::Instant`
#   (`src/bencher.rs`) and `std::fs` (`src/fs.rs`) are not implemented for
#   wasm32-unknown-unknown. Benchmarks are expected to run on the host.
# - `default-features = false` **does not disable plotting**. Dropping
#   `plotters` only removes the pure-Rust backend. If `gnuplot` is on PATH,
#   `PlottingBackend::Gnuplot` uses `criterion-plot` to **launch an external
#   native binary** through `Command::new("gnuplot")` (`default_plotting_backend`
#   in `criterion/src/lib.rs`, and `criterion-plot/src/lib.rs`). Without gnuplot,
#   it falls back to `PlottingBackend::None`, with no C binding or native link
#   in the build graph, so wall 7 trigger 1 does not apply. Plotting is not
#   disabled, however.
# - Criterion also uses OS APIs beyond Instant and fs: `Command::new($CARGO)
#   metadata` (when CARGO_TARGET_DIR is unset), `TcpStream::connect` (for
#   cargo-criterion integration via `CARGO_CRITERION_PORT`), and `process::exit`.
#   These all run inside the dev-dependency benchmark harness.
#
# Rechecked when adding raikiri-bench (raikiri-spike-vvf6): `cargo tree -p
# raikiri-bench -e normal,build,dev` contains neither `alloca` nor `cc`, so
# the same reasoning applies. raikiri-bench itself was not checked for
# wasm32-unknown-unknown: it is a host-only benchmark crate (like raikiri-vrt
# and raikiri-wpt, which also have no wasm32 check), not part of the WASM
# target surface. If this judgment seems too permissive, revisit it in
# raikiri-spike-vvf6.
criterion = { version = "0.8", default-features = false, features = [
    "cargo_bench_support",
] }

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
# Extend as needed after M1. Keep this empty in M0 to focus on resolver="3" behavior.
