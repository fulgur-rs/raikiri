name: WPT model judge

# Judges WPT tests that have no reference file (mostly CSS2 .xht) by sending
# each rendering, its meta assert, and its "Test passes if" text to a Claude
# model. Manual only, so every run's API spend is an explicit decision.
#
# Authentication uses Workload Identity Federation: the job's GitHub OIDC
# token is exchanged for a short-lived Anthropic token, so no API key is
# stored anywhere. The federation rule should match only the claim
# workflow_ref = fulgur-rs/raikiri/.github/workflows/wpt-judge.yml@refs/heads/main.
# The IDs it needs are repository variables (not secrets):
#   ANTHROPIC_FEDERATION_RULE_ID, ANTHROPIC_ORGANIZATION_ID,
#   ANTHROPIC_SERVICE_ACCOUNT_ID, ANTHROPIC_WORKSPACE_ID

on:
  workflow_dispatch:
    inputs:
      limit:
        description: Maximum number of new (uncached) model requests
        default: "200"
      path_prefix:
        description: Only tests below this WPT directory
        default: css/CSS2
      model:
        description: Claude model id
        default: claude-haiku-5-5

permissions:
  contents: read
  id-token: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  judge:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        # Same toolchain resolution as ci.yml (rust-toolchain.toml).
        run: rustup show active-toolchain || rustup toolchain install

      - name: Install system dependencies
        # fontconfig headers are needed to build shodo's system-fonts feature.
        run: |
          sudo apt-get -o Acquire::Retries=2 update
          sudo apt-get install -y libfontconfig1-dev pkg-config

      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@v2

      - name: Fetch WPT at the pinned revision
        run: scripts/wpt/fetch.sh

      - name: Build the review renderer
        run: cargo build --release --locked -p raikiri-wpt --bin prepare-meta-assert-review

      - name: List tests without a reference
        env:
          PATH_PREFIX: ${{ inputs.path_prefix }}
        run: |
          python3 -I - <<'EOF'
          import os, re
          from pathlib import Path
          root = Path("target/wpt").resolve()
          prefix = os.environ["PATH_PREFIX"].strip("/")
          # Reftest links may leave the rel value unquoted.
          link = re.compile(r'rel\s*=\s*["\']?(?:match|mismatch)\b', re.I)
          skip = re.compile(r"(^|/)(support|reference)/|-ref\b|-notref\b")
          ids = []
          for path in sorted((root / prefix).rglob("*")):
              if path.suffix not in (".xht", ".xhtml", ".html", ".htm"):
                  continue
              test_id = path.relative_to(root).as_posix()
              if skip.search(test_id):
                  continue
              source = path.read_text(errors="replace")
              if link.search(source) or "<script" in source.lower():
                  continue
              if not re.search(r"passes? if|\bto pass,", source, re.I):
                  continue
              ids.append(test_id)
          print(f"{len(ids)} candidates")
          Path("judge-tests.txt").write_text("\n".join(ids) + "\n")
          EOF

      - name: Render
        run: |
          ./target/release/prepare-meta-assert-review \
            --wpt-root target/wpt \
            --tests judge-tests.txt \
            --output target/meta-assert-review

      - name: Setup mise
        # Installs the uv pinned in mise.toml; uv then installs the judge's
        # dependencies from the script's inline metadata.
        uses: jdx/mise-action@v2
        with:
          install_args: uv

      - name: Restore verdict cache
        # Verdicts are keyed by model, prompt, and PNG hash, so only changed
        # renderings cost anything on the next run.
        uses: actions/cache/restore@v4
        with:
          path: target/meta-assert-review/judge-cache
          key: wpt-judge-${{ inputs.model }}-${{ github.run_id }}
          restore-keys: wpt-judge-${{ inputs.model }}-

      - name: Judge
        env:
          ANTHROPIC_FEDERATION_RULE_ID: ${{ vars.ANTHROPIC_FEDERATION_RULE_ID }}
          ANTHROPIC_ORGANIZATION_ID: ${{ vars.ANTHROPIC_ORGANIZATION_ID }}
          ANTHROPIC_SERVICE_ACCOUNT_ID: ${{ vars.ANTHROPIC_SERVICE_ACCOUNT_ID }}
          ANTHROPIC_WORKSPACE_ID: ${{ vars.ANTHROPIC_WORKSPACE_ID }}
          ANTHROPIC_IDENTITY_TOKEN_FILE: ${{ runner.temp }}/gha-jwt
          MODEL: ${{ inputs.model }}
          LIMIT: ${{ inputs.limit }}
        run: |
          set -o pipefail
          # GitHub OIDC tokens live about five minutes and each one can be
          # exchanged only once, while the SDK re-reads the file on every
          # refresh. Keep a fresh token in the file for the whole run.
          fetch_token() {
            curl -sSf -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
              "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=https://api.anthropic.com" \
              | jq -r .value > "$ANTHROPIC_IDENTITY_TOKEN_FILE.tmp"
            mv -f "$ANTHROPIC_IDENTITY_TOKEN_FILE.tmp" "$ANTHROPIC_IDENTITY_TOKEN_FILE"
          }
          fetch_token
          ( while sleep 120; do fetch_token; done ) &
          refresher=$!
          trap 'kill "$refresher"' EXIT
          uv run --script scripts/wpt/haiku-judge-meta-assert.py run \
            --review-dir target/meta-assert-review \
            --model "$MODEL" \
            --max-requests "$LIMIT" \
            | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Save verdict cache
        # Save even when some requests failed, so paid verdicts are kept.
        if: always()
        uses: actions/cache/save@v4
        with:
          path: target/meta-assert-review/judge-cache
          key: wpt-judge-${{ inputs.model }}-${{ github.run_id }}

      - name: Upload review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wpt-judge-review
          path: |
            target/meta-assert-review/manifest.jsonl
            target/meta-assert-review/reviews.jsonl
            target/meta-assert-review/html/
            target/meta-assert-review/screenshots/
