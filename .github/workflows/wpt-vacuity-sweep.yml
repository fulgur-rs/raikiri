name: WPT vacuity sweep

# Audits every runnable reftest that no expectations file lists yet with
# audit-vacuous-passes, and reports the ones that now pass without being
# vacuous (verdict KEEP). Detection only: the job never edits expectations
# and does not fail on new KEEP ids. Promote them by hand as described in
# expectations/README.md ("Promoting sweep passes").
#
# Weekly rather than nightly: a KEEP id stays in the report until someone
# promotes it, so a daily run would repeat the same list. Run it by hand
# (workflow_dispatch) after a change that should make tests pass.

on:
  schedule:
    # Sunday 19:00 UTC = Monday 04:00 JST, after the nightly baseline run.
    - cron: "0 19 * * 0"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sweep:
    name: audit-vacuous-passes over unregistered reftests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        # Same toolchain resolution as ci.yml (rust-toolchain.toml).
        run: rustup show active-toolchain || rustup toolchain install

      - name: Install system dependencies
        # fontconfig headers are needed to build shodo's system-fonts feature.
        run: |
          apt_options=(-o Acquire::Retries=2 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20)
          sudo timeout --kill-after=10s 180s apt-get "${apt_options[@]}" --error-on=any update
          sudo timeout --kill-after=10s 180s apt-get "${apt_options[@]}" install -y libfontconfig1-dev pkg-config

      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@v2

      - name: Run the sweep
        run: |
          set -o pipefail
          mkdir -p target
          scripts/wpt/vacuity-sweep.sh target/wpt-vacuity 2>&1 | tee target/wpt-vacuity.log

      - name: Summarize KEEP ids
        if: always()
        run: |
          dir=target/wpt-vacuity
          [ -f "$dir/audit.tsv" ] || exit 0
          {
            echo '## WPT vacuity sweep'
            echo
            cat "$dir/meta.txt" 2>/dev/null | sed 's/^/- /' || true
            echo
            echo '| Verdict | Count |'
            echo '| --- | --- |'
            awk -F '\t' '{ count[$2]++ } END { for (v in count) printf "| %s | %d |\n", v, count[v] }' "$dir/audit.tsv" | sort
            echo
            keep_count="$(wc -l < "$dir/keep.txt")"
            if [ "$keep_count" -eq 0 ]; then
              echo 'No unregistered reftest passes the audit.'
            else
              echo "$keep_count ids pass the audit and are promotion candidates (full list in the artifact):"
              echo
              head -n 200 "$dir/keep.txt" | sed 's/.*/- `&`/'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wpt-vacuity-sweep
          path: |
            target/wpt-vacuity/candidates.txt
            target/wpt-vacuity/audit.tsv
            target/wpt-vacuity/keep.txt
            target/wpt-vacuity/meta.txt
            target/wpt-vacuity.log
          if-no-files-found: ignore
