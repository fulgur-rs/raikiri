name: CI

# `on:` に paths-ignore を付けると、docs/.beads/*.md-only の push・PR では
# ワークフロー自体がキューされず check run が一切 post されない。branch
# protection でこの job を required status check にすると、そうした PR は
# 判定待ちのまま永久に merge 不可になる (GitHub Actions の既知の footgun)。
# そのため trigger 側の paths-ignore は使わず、常にワークフローを起動した
# 上で `changes` job が実際の diff を見て `ci` job の `if:` を切り替える。
# job が `if:` で skip された場合は check run が "skipped" (=成功扱い) で
# post されるため、required status check でも正しく通過する。

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: detect relevant changes
    runs-on: ubuntu-latest
    # dorny/paths-filter queries the PR's changed files via the GitHub API,
    # which needs pull-requests: read beyond the repo-wide contents: read.
    permissions:
      contents: read
      pull-requests: read
    outputs:
      relevant: ${{ steps.filter.outputs.relevant }}
    steps:
      # dorny/paths-filter only has an API-based diff path for pull_request
      # events; for push (direct commits/merges to main) it shells out to
      # git against the job's own checkout, so one is required here too.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine whether non-doc paths changed
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            relevant:
              - '**'
              - '!docs/**'
              - '!.beads/**'
              - '!*.md'

  ci:
    name: fmt + test + clippy
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space on the runner
        # boa_engine (raikiri-js) を追加した際に "No space left on device" で
        # fmt+test+clippy job が落ちた (他の同時期の CI run は全て成功、この
        # PR の branch だけ失敗、ローカル再現なし → runner のプリインストール
        # 済みツール群込みのディスク使用量が上限に近く、依存 tree 追加分で
        # 溢れたと判断)。Android SDK / .NET / Haskell 等の未使用ツールを削除
        # して空き容量を確保する。
        uses: jlumbroso/free-disk-space@v2.0.0
        with:
          preinstalled-runtimes: false
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: true
          swap-storage: false

      - name: Setup Rust toolchain
        # rustup が rust-toolchain.toml (1.91.0 + rustfmt + clippy) を尊重、
        # first cargo 呼び出し前に explicit install する。dtolnay/rust-toolchain
        # の explicit version は two sources of truth 化を招くため使わない。
        # rustup ≥ 1.28 で `show` の implicit install が消えたため `|| rustup
        # toolchain install` を fallback として付ける (idempotent、pre-1.28 でも
        # 無害)。
        run: rustup show active-toolchain || rustup toolchain install

      - name: Install system dependencies
        # yeslogic-fontconfig-sys (fontique/parley 依存) が libfontconfig / pkg-config
        # を必要とする。ubuntu-latest には fontconfig ランタイムはあるが `-dev`
        # ヘッダーが無いため build script が pkg-config で失敗する (initial CI run
        # で観測)。macOS/Windows job を追加する時は fontconfig の platform 別 install
        # をここに拡張する。
        run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev pkg-config

      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@v2

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Test (workspace, locked)
        # lib + integration + doctest + bin unittests を全カバー。yps landing 済の
        # validate_expectations_bin.rs (assert_cmd 経由の bin end-to-end) と全 crate
        # の doctest が含まれる。raikiri-vrt の image-compare integration は m1.10
        # reference harness 完了後に追加、その時は #[ignore] / feature flag で opt-in
        # (default CI では skip、ondemand で走らせる) を検討する。--locked で
        # Cargo.lock drift を弾く。
        run: cargo test --workspace --locked

      - name: Clippy (all targets, deny warnings)
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  coverage:
    name: coverage
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space on the runner
        uses: jlumbroso/free-disk-space@v2.0.0
        with:
          preinstalled-runtimes: false
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: true
          swap-storage: false

      - name: Setup Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev pkg-config

      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Generate LCOV report
        run: cargo llvm-cov --workspace --locked --lcov --output-path lcov.info

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: lcov.info
          flags: rust
          fail_ci_if_error: true
