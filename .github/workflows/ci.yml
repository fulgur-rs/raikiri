name: CI

# Adding `paths-ignore` to `on:` would prevent docs/.beads/*.md-only pushes
# and PRs from queuing this workflow, so they would never post a check run.
# If branch protection requires this job, those PRs would wait forever and
# could not merge (a known GitHub Actions pitfall). Instead, always start
# the workflow; the `changes` job inspects the diff and sets `ci`'s `if:`.
# A job skipped by `if:` posts a "skipped" check run, which counts as success
# for the required status check.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: detect relevant changes
    runs-on: ubuntu-latest
    # dorny/paths-filter queries the PR's changed files via the GitHub API,
    # which needs pull-requests: read beyond the repo-wide contents: read.
    permissions:
      contents: read
      pull-requests: read
    outputs:
      relevant: ${{ steps.filter.outputs.relevant }}
    steps:
      # dorny/paths-filter only has an API-based diff path for pull_request
      # events; for push (direct commits/merges to main) it shells out to
      # git against the job's own checkout, so one is required here too.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine whether non-doc paths changed
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            relevant:
              - '**'
              - '!docs/**'
              - '!.beads/**'
              - '!*.md'

  ci:
    name: fmt + test + clippy
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space on the runner
        # Adding boa_engine (raikiri-js) made the fmt+test+clippy job fail with
        # "No space left on device". Other contemporaneous CI runs passed,
        # only this PR branch failed, and the failure did not reproduce locally.
        # The runner was likely near its disk limit with preinstalled tools,
        # and the larger dependency tree pushed it over. Remove unused Android
        # SDK, .NET, Haskell, and other tools to reclaim space.
        uses: jlumbroso/free-disk-space@v2.0.0
        with:
          preinstalled-runtimes: false
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: true
          swap-storage: false

      - name: Setup Rust toolchain
        # Respect rust-toolchain.toml (1.91.0 + rustfmt + clippy) and install
        # before the first cargo call. An explicit version in dtolnay/rust-toolchain
        # would create two sources of truth. Since rustup 1.28, `show` no longer
        # installs implicitly; fall back to `rustup toolchain install` (idempotent
        # and harmless with older rustup versions).
        run: rustup show active-toolchain || rustup toolchain install

      - name: Install system dependencies
        # yeslogic-fontconfig-sys needs libfontconfig and pkg-config. It is
        # linked by fontique's `system` feature, which shodo's `system-fonts`
        # feature enables for the inline engine (and which the blitz crates
        # used as the WPT oracle enable too). ubuntu-latest has the fontconfig
        # runtime but not the development headers, so the build script failed
        # at pkg-config in the initial CI run. Add platform-specific
        # installation if macOS/Windows jobs are introduced.
        run: |
          apt_options=(-o Acquire::Retries=2 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20)
          # Bound package acquisition and fail on incomplete index updates.
          sudo timeout --kill-after=10s 180s apt-get "${apt_options[@]}" --error-on=any update
          sudo timeout --kill-after=10s 180s apt-get "${apt_options[@]}" install -y libfontconfig1-dev pkg-config

      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@v2

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Python script tests
        run: python3 -m unittest discover -s scripts/lib -p 'test_*.py'

      - name: Orphan tests.rs lint
        # Same command as scripts/gate.sh §8.1(b). This Python static check
        # needs no Rust toolchain, but runs in the same job as other cheap lints.
        run: scripts/orphan-tests-lint.sh

      - name: Test (workspace, locked)
        # Cover library, integration, doctest, and binary unit tests, including
        # validate_expectations_bin.rs (end-to-end via assert_cmd, landed in yps)
        # and every crate's doctests. Add raikiri-vrt image-compare integration
        # after the m1.10 reference harness; consider opting in with #[ignore]
        # or a feature flag so default CI skips it and it runs on demand.
        # --locked rejects Cargo.lock drift.
        run: cargo test --workspace --locked

      - name: Clippy (all targets, deny warnings)
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Rustdoc (private items, deny warnings)
        # Same command as scripts/gate.sh §8.1(b). Without this in CI, an
        # ambiguous intra-doc link (`crate::parse` resolves to both a function
        # and a module) reached main despite green CI and broke every branch's
        # gate. Keep the job name because it may be a required status check;
        # add the check as a step instead.
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --no-deps --workspace --document-private-items --locked

      # raikiri-net's `http-ureq` feature (UreqHttpProvider) is off by default;
      # no workspace crate enables it. The workspace test/clippy/doc steps
      # above therefore never compile it. Enable it explicitly in separate
      # commands matching scripts/gate.sh.
      - name: Test (raikiri-net, http-ureq feature)
        run: cargo test -p raikiri-net --features http-ureq --locked

      - name: Clippy (raikiri-net, http-ureq feature, deny warnings)
        run: cargo clippy -p raikiri-net --features http-ureq --all-targets --locked -- -D warnings

      - name: Rustdoc (raikiri-net, http-ureq feature, private items, deny warnings)
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --no-deps -p raikiri-net --features http-ureq --document-private-items --locked

  coverage:
    name: coverage
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space on the runner
        uses: jlumbroso/free-disk-space@v2.0.0
        with:
          preinstalled-runtimes: false
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: true
          swap-storage: false

      - name: Setup Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - name: Install system dependencies
        run: |
          apt_options=(-o Acquire::Retries=2 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20)
          # Bound package acquisition and fail on incomplete index updates.
          sudo timeout --kill-after=10s 180s apt-get "${apt_options[@]}" --error-on=any update
          sudo timeout --kill-after=10s 180s apt-get "${apt_options[@]}" install -y libfontconfig1-dev pkg-config

      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      # `--features raikiri-net/http-ureq` explicitly includes the default-off
      # UreqHttpProvider (http_provider / http_resolver) in coverage, as in
      # the test job above. It does not affect other crates.
      - name: Generate LCOV report
        run: cargo llvm-cov --workspace --features raikiri-net/http-ureq --locked --lcov --output-path lcov.info

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: lcov.info
          flags: rust
          fail_ci_if_error: true
          use_oidc: true
