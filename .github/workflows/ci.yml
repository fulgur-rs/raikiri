name: CI

# Adding `paths-ignore` to `on:` would prevent docs/.beads/*.md-only pushes
# and PRs from queuing this workflow, so they would never post a check run.
# If branch protection requires this job, those PRs would wait forever and
# could not merge (a known GitHub Actions pitfall). Instead, always start
# the workflow; the `changes` job inspects the diff and sets `ci`'s `if:`.
# A job skipped by `if:` posts a "skipped" check run, which counts as success
# for the required status check.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Stacked pull requests: GitHub runs this workflow for every PR in a stack
# as if it targeted the stack base, so one push in the middle of a stack
# re-runs every PR above it. `ci` and `coverage` therefore run only for PRs
# outside a stack, for the lowest unmerged PR (the one that targets the stack
# base directly), and for the top PR (which carries the whole stack's
# changes); middle PRs skip them. `stack` is null on push events and for PRs
# outside a stack, so those always run everything. See
# https://docs.github.com/en/pull-requests/how-tos/merge-and-close-pull-requests/optimizing-ci-for-stacked-pull-requests
jobs:
  changes:
    name: detect relevant changes
    runs-on: ubuntu-latest
    # dorny/paths-filter queries the PR's changed files via the GitHub API,
    # which needs pull-requests: read beyond the repo-wide contents: read.
    permissions:
      contents: read
      pull-requests: read
    outputs:
      relevant: ${{ steps.filter.outputs.relevant }}
    steps:
      # dorny/paths-filter only has an API-based diff path for pull_request
      # events; for push (direct commits/merges to main) it shells out to
      # git against the job's own checkout, so one is required here too.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine whether non-doc paths changed
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            relevant:
              - '**'
              - '!docs/**'
              - '!.beads/**'
              - '!*.md'

  ci:
    name: fmt + test + clippy
    needs: changes
    if: needs.changes.outputs.relevant == 'true' && (github.event.pull_request.stack == null || github.event.pull_request.stack.base.ref == github.event.pull_request.base.ref || github.event.pull_request.stack.position == github.event.pull_request.stack.size)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space on the runner
        # Adding boa_engine (raikiri-js) made the fmt+test+clippy job fail with
        # "No space left on device". Other contemporaneous CI runs passed,
        # only this PR branch failed, and the failure did not reproduce locally.
        # The runner was likely near its disk limit with preinstalled tools,
        # and the larger dependency tree pushed it over. Remove unused Android
        # SDK, .NET, Haskell, and other tools to reclaim space.
        uses: jlumbroso/free-disk-space@v2.0.0
        with:
          preinstalled-runtimes: false
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: true
          swap-storage: false

      - name: Setup Rust toolchain
        # Respect rust-toolchain.toml (1.91.0 + rustfmt + clippy) and install
        # before the first cargo call. An explicit version in dtolnay/rust-toolchain
        # would create two sources of truth. Since rustup 1.28, `show` no longer
        # installs implicitly; fall back to `rustup toolchain install` (idempotent
        # and harmless with older rustup versions).
        run: rustup show active-toolchain || rustup toolchain install

      - name: Install system dependencies
        # yeslogic-fontconfig-sys needs libfontconfig and pkg-config. It is
        # linked by fontique's `system` feature, which shodo's `system-fonts`
        # feature enables for the inline engine (and which the blitz crates
        # used as the WPT oracle enable too). ubuntu-latest has the fontconfig
        # runtime but not the development headers, so the build script failed
        # at pkg-config in the initial CI run. Add platform-specific
        # installation if macOS/Windows jobs are introduced.
        run: |
          apt_options=(-o Acquire::Retries=2 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20)
          # Bound package acquisition and fail on incomplete index updates.
          sudo timeout --kill-after=10s 180s apt-get "${apt_options[@]}" --error-on=any update
          sudo timeout --kill-after=10s 180s apt-get "${apt_options[@]}" install -y libfontconfig1-dev pkg-config

      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@v2
        with:
          # The cache key does not cover `[profile]` changes in Cargo.toml.
          # On a full key match rust-cache skips saving, so a stale cache
          # built under the old profile would be restored forever. Bump this
          # prefix (in both jobs) whenever a profile change alters how
          # dependencies are built.
          prefix-key: v1-rust

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Python script tests
        run: python3 -m unittest discover -s scripts/lib -p 'test_*.py'

      - name: Orphan tests.rs lint
        # Same command as scripts/gate.sh. This Python static check
        # needs no Rust toolchain, but runs in the same job as other cheap lints.
        run: scripts/orphan-tests-lint.sh

      - name: Taffy boundary lint
        # Same command as scripts/gate.sh. Pure Python; the per-file baseline
        # of remaining Taffy name uses may only go down.
        run: scripts/taffy-boundary-lint.sh

      - name: Test (workspace, locked)
        # Cover library, integration, doctest, and binary unit tests, including
        # validate_expectations_bin.rs (end-to-end via assert_cmd, landed in yps)
        # and every crate's doctests. Add raikiri-vrt image-compare integration
        # after the m1.10 reference harness; consider opting in with #[ignore]
        # or a feature flag so default CI skips it and it runs on demand.
        # --locked rejects Cargo.lock drift.
        run: cargo test --workspace --locked

      - name: Clippy (all targets, deny warnings)
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Rustdoc (private items, deny warnings)
        # Same command as scripts/gate.sh. Without this in CI, an
        # ambiguous intra-doc link (`crate::parse` resolves to both a function
        # and a module) reached main despite green CI and broke every branch's
        # gate. Keep the job name because it may be a required status check;
        # add the check as a step instead.
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --no-deps --workspace --document-private-items --locked

      - name: Public API lint
        # Same command as scripts/gate.sh. Builds the rustdoc JSON of the
        # workspace (only rustdoc is bootstrapped, the dependency build is the
        # one of the step above) and fails when a public item of a
        # consumer-facing crate names a Taffy type, or a published crate names
        # a type of a crate it is not allowed to.
        run: scripts/public-api-lint.sh

      # raikiri-net's `http-ureq` feature (UreqHttpProvider) is off by default;
      # no workspace crate enables it. The workspace test/clippy/doc steps
      # above therefore never compile it. Enable it explicitly in separate
      # commands matching scripts/gate.sh.
      - name: Test (raikiri-net, http-ureq feature)
        run: cargo test -p raikiri-net --features http-ureq --locked

      - name: Clippy (raikiri-net, http-ureq feature, deny warnings)
        run: cargo clippy -p raikiri-net --features http-ureq --all-targets --locked -- -D warnings

      - name: Rustdoc (raikiri-net, http-ureq feature, private items, deny warnings)
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --no-deps -p raikiri-net --features http-ureq --document-private-items --locked

  # Reports the breaking changes a pull request makes to the published API.
  # Report only while the crates are at 0.0.x (see docs/public-api.md): the
  # job passes whatever it finds, and shows the findings in the job summary and
  # as a warning annotation. Switch the script to `--strict` once the crates
  # are published and a breaking change must bump the version.
  semver:
    name: public API breaking changes (report)
    needs: changes
    # Only a pull request has a base to compare with, and only a change of
    # code can change the API.
    if: github.event_name == 'pull_request' && needs.changes.outputs.relevant == 'true' && (github.event.pull_request.stack == null || github.event.pull_request.stack.base.ref == github.event.pull_request.base.ref || github.event.pull_request.stack.position == github.event.pull_request.stack.size)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # A report must not block a merge: a failure of the tooling itself (the
    # tool, the registry, the runner) is shown in the step and as a warning,
    # and does not turn the pull request red.
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # The merge base with the base branch must be reachable.
          fetch-depth: 0

      - name: Free disk space on the runner
        uses: jlumbroso/free-disk-space@v2.0.0
        with:
          preinstalled-runtimes: false
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: true
          swap-storage: false

      - name: Setup Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - name: Install system dependencies
        run: |
          apt_options=(-o Acquire::Retries=2 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20)
          # Bound package acquisition and fail on incomplete index updates.
          sudo timeout --kill-after=10s 180s apt-get "${apt_options[@]}" --error-on=any update
          sudo timeout --kill-after=10s 180s apt-get "${apt_options[@]}" install -y libfontconfig1-dev pkg-config

      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@v2
        with:
          # Keep in sync with the `ci` job's prefix-key.
          prefix-key: v1-rust

      - name: Install cargo-semver-checks
        # 0.49.x is the last release that reads the rustdoc JSON of the
        # pinned 1.91.0 toolchain (format 56). Change it together with
        # KNOWN_FORMAT_VERSIONS in scripts/lib/public_api_lint.py.
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-semver-checks@0.49.0

      - name: Compare the public API with the base branch
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          scripts/semver-checks.sh --base "origin/$BASE_REF" 2>&1 | tee "$RUNNER_TEMP/semver.log"
          status="${PIPESTATUS[0]}"
          {
            echo '### Public API'
            echo '```'
            tail -n 300 "$RUNNER_TEMP/semver.log"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if grep -q 'breaks the published API' "$RUNNER_TEMP/semver.log"; then
            echo "::warning title=Public API::this change breaks the published API; see the job summary (report only at 0.0.x)"
          fi
          if [ "$status" -ne 0 ]; then
            echo "::warning title=Public API::the report could not be made (exit status $status); see the job log"
          fi
          exit "$status"

  # Packages the crates that go to crates.io and builds each package, without
  # publishing: catches missing manifest metadata, files that live outside a
  # crate's directory and dependency cycles through dev-dependencies before the
  # first publication does. Needs no credentials (see docs/releasing.md).
  publish-dry-run:
    name: package the publishable crates
    needs: changes
    if: needs.changes.outputs.relevant == 'true' && (github.event.pull_request.stack == null || github.event.pull_request.stack.base.ref == github.event.pull_request.base.ref || github.event.pull_request.stack.position == github.event.pull_request.stack.size)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - name: Install system dependencies
        run: |
          apt_options=(-o Acquire::Retries=2 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20)
          # Bound package acquisition and fail on incomplete index updates.
          sudo timeout --kill-after=10s 180s apt-get "${apt_options[@]}" --error-on=any update
          sudo timeout --kill-after=10s 180s apt-get "${apt_options[@]}" install -y libfontconfig1-dev pkg-config

      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@v2
        with:
          # Keep in sync with the `ci` job's prefix-key.
          prefix-key: v1-rust

      - name: Package every publishable crate (dry run)
        run: scripts/publish-dry-run.sh

  coverage:
    name: coverage
    needs: changes
    if: needs.changes.outputs.relevant == 'true' && (github.event.pull_request.stack == null || github.event.pull_request.stack.base.ref == github.event.pull_request.base.ref || github.event.pull_request.stack.position == github.event.pull_request.stack.size)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space on the runner
        uses: jlumbroso/free-disk-space@v2.0.0
        with:
          preinstalled-runtimes: false
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: true
          swap-storage: false

      - name: Setup Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - name: Install system dependencies
        run: |
          apt_options=(-o Acquire::Retries=2 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20)
          # Bound package acquisition and fail on incomplete index updates.
          sudo timeout --kill-after=10s 180s apt-get "${apt_options[@]}" --error-on=any update
          sudo timeout --kill-after=10s 180s apt-get "${apt_options[@]}" install -y libfontconfig1-dev pkg-config

      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@v2
        with:
          # Keep in sync with the `ci` job's prefix-key.
          prefix-key: v1-rust

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      # `--features raikiri-net/http-ureq` explicitly includes the default-off
      # UreqHttpProvider (http_provider / http_resolver) in coverage, as in
      # the test job above. It does not affect other crates.
      - name: Generate LCOV report
        run: cargo llvm-cov --workspace --features raikiri-net/http-ureq --locked --lcov --output-path lcov.info

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: lcov.info
          flags: rust
          fail_ci_if_error: true
          use_oidc: true
