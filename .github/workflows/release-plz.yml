name: Release-plz

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      release:
        description: Publish and tag the current version (waits for the crates-io approval)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  # The release job publishes to crates.io and runs in the `crates-io`
  # environment, which has required reviewers. An environment pauses a job as
  # soon as it is eligible to run, so without this guard every ordinary merge
  # to main would wait for a release approval. This job decides whether the
  # push is a release, and the release job runs only when it is.
  check-releases:
    name: Detect a merged Release PR
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      has_releases: ${{ steps.check.outputs.has_releases }}
    steps:
      - name: Determine whether this push is a release
        id: check
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_RELEASE: ${{ inputs.release }}
          HEAD_MSG: ${{ github.event.head_commit.message }}
          COMMIT_MSGS: ${{ toJSON(github.event.commits.*.message) }}
        run: |
          set -euo pipefail
          emit() { echo "has_releases=$1" >> "$GITHUB_OUTPUT"; echo "has_releases=$1 ($2)"; }

          # A manual run only updates the Release PR unless it asks to release;
          # a release still waits for the crates-io approval.
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            if [ "$DISPATCH_RELEASE" = "true" ]; then emit true "workflow_dispatch with release"; else emit false "workflow_dispatch"; fi
            exit 0
          fi

          # Merge commit of a Release PR: its head branch is
          # release-plz-<date>, which the default merge subject names.
          HEAD_SUBJECT="${HEAD_MSG%%$'\n'*}"
          if printf '%s\n' "$HEAD_SUBJECT" | grep -qE 'release-plz-[0-9]{4}-[0-9]{2}-[0-9]{2}'; then
            emit true "Release PR merge commit"; exit 0
          fi

          # Squash or rebase merge: release-plz's own `chore: release vX.Y.Z`
          # commit is in the push either way.
          if printf '%s' "$COMMIT_MSGS" | jq -r '.[]? | split("\n")[0]' \
               | grep -qE '^chore: release v[0-9]'; then
            emit true "chore: release commit in push"; exit 0
          fi

          emit false "no release markers"

  release-pr:
    name: Create or update Release PR
    # Tags are created before the next version is analysed, so this job waits
    # for the release job; it still runs when that job is skipped because the
    # push is not a release.
    needs: [check-releases, release]
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' && needs.check-releases.result == 'success' && needs.release.result != 'failure' }}
    runs-on: ubuntu-latest
    env:
      RUSTUP_TOOLCHAIN: stable
    concurrency:
      group: release-plz-release-pr-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Cache Cargo registry
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-plz

      - name: Create repository-scoped GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.RELEASE_PLZ_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_PLZ_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write

      - uses: release-plz/action@v0.5
        id: release-pr
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
        with:
          command: release-pr
          version: "0.4.0"

      - name: Check out Release PR to synchronize the tools workspace
        if: steps.release-pr.outputs.prs_created == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ fromJSON(steps.release-pr.outputs.pr).head_branch }}
          token: ${{ steps.app-token.outputs.token }}

      - name: Synchronize Wasmtime tools lockfile
        if: steps.release-pr.outputs.prs_created == 'true'
        env:
          RELEASE_BRANCH: ${{ fromJSON(steps.release-pr.outputs.pr).head_branch }}
        run: |
          cargo update --workspace --manifest-path tools/raikiri-js-wasmtime/Cargo.toml
          if ! git diff --quiet -- tools/raikiri-js-wasmtime/Cargo.lock; then
            git add tools/raikiri-js-wasmtime/Cargo.lock
            git commit -m "chore: synchronize Wasmtime lockfile with release version"
            git push origin "HEAD:$RELEASE_BRANCH"
          fi

  release:
    name: Publish and tag a merged Release PR
    needs: check-releases
    if: needs.check-releases.outputs.has_releases == 'true'
    runs-on: ubuntu-latest
    # Serialize publishing so that a push landing during a release cannot start
    # a second `release-plz release` for the same version.
    concurrency:
      group: release-plz-publish
      cancel-in-progress: false
    # The environment is the release approval (required reviewers), and it
    # stamps the OIDC token with `environment:crates-io`, which the Trusted
    # Publisher of each published crate on crates.io requires.
    environment: crates-io
    permissions:
      contents: write
      pull-requests: read
      id-token: write  # crates.io Trusted Publishing (OIDC)
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # cargo publish builds every package before uploading it, and
      # raikiri-dom reaches yeslogic-fontconfig-sys, whose build script needs
      # the fontconfig development files (same step as in ci.yml).
      - name: Install system dependencies
        run: |
          apt_options=(-o Acquire::Retries=2 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20)
          # Bound package acquisition and fail on incomplete index updates.
          sudo timeout --kill-after=10s 180s apt-get "${apt_options[@]}" --error-on=any update
          sudo timeout --kill-after=10s 180s apt-get "${apt_options[@]}" install -y libfontconfig1-dev pkg-config

      - name: Cache Cargo registry
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-plz

      - name: Configure initial version tags
        id: release-config
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          config=release-plz.toml
          # With no baseline tag, release-pr has no version change to propose.
          # Bootstrap 0.0.1 once; subsequent tags require a merged Release PR.
          # A manual run that asks to release is not a Release PR merge either,
          # so it releases the current version the same way: release-plz
          # publishes the packages whose version is not on crates.io and tags
          # the ones without a tag, and skips the rest.
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"])')
          if [[ "$EVENT_NAME" == "workflow_dispatch" || ( "$version" == "0.0.1" && -z "$(git tag --list 'raikiri-v*')" ) ]]; then
            config="$RUNNER_TEMP/release-plz-initial.toml"
            sed 's/^release_always = false$/release_always = true/' release-plz.toml > "$config"
          fi
          echo "path=$config" >> "$GITHUB_OUTPUT"

      - name: Authenticate to crates.io
        id: crates-auth
        uses: rust-lang/crates-io-auth-action@v1

      - uses: release-plz/action@v0.5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-auth.outputs.token }}
        with:
          command: release
          version: "0.4.0"
          config: ${{ steps.release-config.outputs.path }}
