name: Release-plz

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-pr:
    name: Create or update Release PR
    needs: release
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      RUSTUP_TOOLCHAIN: stable
    concurrency:
      group: release-plz-release-pr-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Cache Cargo registry
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-plz

      - name: Create repository-scoped GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.RELEASE_PLZ_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_PLZ_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write

      - uses: release-plz/action@v0.5
        id: release-pr
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
        with:
          command: release-pr
          version: "0.4.0"

      - name: Check out Release PR to synchronize the tools workspace
        if: steps.release-pr.outputs.prs_created == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ fromJSON(steps.release-pr.outputs.pr).head_branch }}
          token: ${{ steps.app-token.outputs.token }}

      - name: Synchronize Wasmtime tools lockfile
        if: steps.release-pr.outputs.prs_created == 'true'
        env:
          RELEASE_BRANCH: ${{ fromJSON(steps.release-pr.outputs.pr).head_branch }}
        run: |
          cargo update --workspace --manifest-path tools/raikiri-js-wasmtime/Cargo.toml
          if ! git diff --quiet -- tools/raikiri-js-wasmtime/Cargo.lock; then
            git add tools/raikiri-js-wasmtime/Cargo.lock
            git commit -m "chore: synchronize Wasmtime lockfile with release version"
            git push origin "HEAD:$RELEASE_BRANCH"
          fi

  release:
    name: Create tags for merged Release PR
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure initial version tags
        id: release-config
        shell: bash
        run: |
          config=release-plz.toml
          # With no baseline tag, release-pr has no version change to propose.
          # Bootstrap 0.0.1 once; subsequent tags require a merged Release PR.
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"])')
          if [[ "$version" == "0.0.1" && -z "$(git tag --list 'raikiri-v*')" ]]; then
            config="$RUNNER_TEMP/release-plz-initial.toml"
            sed 's/^release_always = false$/release_always = true/' release-plz.toml > "$config"
          fi
          echo "path=$config" >> "$GITHUB_OUTPUT"

      - uses: release-plz/action@v0.5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          command: release
          version: "0.4.0"
          config: ${{ steps.release-config.outputs.path }}
