[package]
name = "raikiri-dom"
version = "0.1.0"
description = "DOM data model + taffy/parley layout engine + PageStream/LayoutBuffer + GCPM runtime side (PageContext, TargetRegistry, PageBoxCache) for raikiri"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
bitflags       = "2"
# East Asian Width for CSS Text 3 §4.1.2 segment-break decisions (lone
# breaks between inlines). Mirrors parley's own dependency spec exactly
# (same version range, no default features, compiled_data) so feature
# unification with the existing parley consumer is a no-op.
icu_properties = { version = "2", default-features = false, features = ["compiled_data"] }
parley         = { workspace = true }
raikiri-style  = { workspace = true }
raikiri-traits = { workspace = true }
rayon          = "1.8"
smol_str       = { workspace = true }
taffy          = { workspace = true }
wuff           = { workspace = true }
url            = { workspace = true }

[dev-dependencies]
criterion = { workspace = true }
raikiri-html = { workspace = true }
raikiri-style = { workspace = true }
tempfile = { workspace = true }

# rustix backs `check_open_handle_containment`'s Apple-platform arm
# (crates/raikiri-dom/src/fonts.rs, `fcntl(fd, F_GETPATH, ..)` via
# `rustix::fs::getpath`). Target-gated to the same platform set as the
# code `cfg` that uses it (macOS/iOS/tvOS/watchOS/visionOS; `rustix::fs::getpath`
# is itself `#[cfg(apple)]`-gated internally, see rustix's own build.rs)
# so Linux/Windows/non-Apple-BSD builds do not gain a dependency they
# never compile against. Already present transitively at v1.1.4 via
# `tempfile` (see Cargo.lock) before this change; "1" keeps resolution
# pinned to that same major-version-compatible release rather than
# forcing an unrelated bump. Default features (`std`, hence `alloc`) are
# load-bearing and must stay on: `rustix::fs::getpath` requires
# `feature = "alloc"`, and the `Errno` -> `std::io::Error` conversion the
# Apple arm's error mapping depends on requires `feature = "std"` (both
# gated internally in rustix's source) — do not add
# `default-features = false` without re-adding `std`.
[target.'cfg(any(target_os = "macos", target_os = "ios", target_os = "tvos", target_os = "watchos", target_os = "visionos"))'.dependencies]
rustix = { version = "1", features = ["fs"] }

[lints]
workspace = true

[[bench]]
name = "layout"
harness = false
