[package]
name = "raikiri-dom"
# Integration tests build as one binary (tests/all.rs) plus the [[test]]
# targets at the end of this file; see tests/all.rs.
autotests = false
version.workspace = true
description = "DOM data model + taffy block layout and shodo inline layout engine + PageStream/LayoutBuffer + GCPM runtime side (PageContext, TargetRegistry, PageBoxCache) for raikiri"
readme = "README.md"
keywords = ["dom", "layout", "css", "gcpm", "paged-media"]
categories = ["rendering", "web-programming"]
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
base-url-diagnostics = []
insertion-diagnostics = []
continuation-diagnostics = []
table-reservation-diagnostics = []
running-index-diagnostics = []
logical-snapshot = []
snapshot-serde = ["logical-snapshot", "dep:serde"]

[dependencies]
rustc-hash = { workspace = true }
serde = { version = "1", features = ["derive"], optional = true }
bitflags       = "2"
cssparser      = { workspace = true }
icu_properties = "2.2"
shodo          = { workspace = true }
skrifa         = { workspace = true }
raikiri-style  = { workspace = true }
raikiri-layout-geometry = { workspace = true }
raikiri-layout-style = { workspace = true }
raikiri-traits = { workspace = true }
rayon          = "1.8"
smol_str       = { workspace = true }
stacker        = { workspace = true }
taffy          = { workspace = true }
tempfile       = { workspace = true }
wuff           = { workspace = true }
url            = { workspace = true }

[dev-dependencies]
raikiri-net = { workspace = true }
serde_json = "1"
criterion = { workspace = true }
# Path only, without a version: raikiri-html depends on this crate, so a
# versioned dev-dependency would make the packages circular (cargo drops a
# dev-dependency without a version from the published manifest).
raikiri-html = { path = "../raikiri-html" }
raikiri-style = { workspace = true }

[lints]
workspace = true

[[bench]]
name = "layout"
harness = false

[[bench]]
name = "mutation"
harness = false

[[bench]]
name = "pipeline"
harness = false

[[bench]]
name = "page_preparation"
harness = false

# One binary for the plain integration-test files (see tests/all.rs). The
# targets after it need a process of their own.
[[test]]
name = "all"
path = "tests/all.rs"

[[test]]
name = "character_data_append_allocations"
path = "tests/character_data_append_allocations.rs"

[[test]]
name = "first_line_allocation_tests"
path = "tests/first_line_allocation_tests.rs"

[[test]]
name = "line_owner_projection_tests"
path = "tests/line_owner_projection_tests.rs"

[[test]]
name = "page_name_allocations"
path = "tests/page_name_allocations.rs"

[[test]]
name = "principal_writing_mode"
path = "tests/principal_writing_mode.rs"

[[test]]
name = "sibling_margin_allocations"
path = "tests/sibling_margin_allocations.rs"

[[test]]
name = "sibling_shift_allocations"
path = "tests/sibling_shift_allocations.rs"

[[test]]
name = "stretch_replaced_height"
path = "tests/stretch_replaced_height.rs"

[[test]]
name = "generated_image_prep_probe"
path = "tests/generated_image_prep_probe.rs"

[[test]]
name = "line_range_pagination_probe"
path = "tests/line_range_pagination_probe.rs"

[[test]]
name = "shrink_to_fit_percentages"
path = "tests/shrink_to_fit_percentages.rs"

[[test]]
name = "vertical_shrink_to_fit_ratio_width"
path = "tests/vertical_shrink_to_fit_ratio_width.rs"
