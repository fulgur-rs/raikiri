[package]
name = "raikiri-dom"
version.workspace = true
description = "DOM data model + taffy block layout and shodo inline layout engine + PageStream/LayoutBuffer + GCPM runtime side (PageContext, TargetRegistry, PageBoxCache) for raikiri"
readme = "README.md"
keywords = ["dom", "layout", "css", "gcpm", "paged-media"]
categories = ["rendering", "web-programming"]
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
continuation-diagnostics = []
table-reservation-diagnostics = []
running-index-diagnostics = []
logical-snapshot = []
snapshot-serde = ["logical-snapshot", "dep:serde"]

[dependencies]
rustc-hash = { workspace = true }
serde = { version = "1", features = ["derive"], optional = true }
bitflags       = "2"
cssparser      = { workspace = true }
shodo          = { workspace = true }
skrifa         = { workspace = true }
raikiri-style  = { workspace = true }
raikiri-layout-geometry = { workspace = true }
raikiri-layout-style = { workspace = true }
raikiri-traits = { workspace = true }
rayon          = "1.8"
smol_str       = { workspace = true }
stacker        = { workspace = true }
taffy          = { workspace = true }
wuff           = { workspace = true }
url            = { workspace = true }

[dev-dependencies]
raikiri-net = { workspace = true }
serde_json = "1"
criterion = { workspace = true }
# Path only, without a version: raikiri-html depends on this crate, so a
# versioned dev-dependency would make the packages circular (cargo drops a
# dev-dependency without a version from the published manifest).
raikiri-html = { path = "../raikiri-html" }
raikiri-style = { workspace = true }
tempfile = { workspace = true }

[lints]
workspace = true

[[bench]]
name = "layout"
harness = false

[[bench]]
name = "mutation"
harness = false

[[bench]]
name = "pipeline"
harness = false

[[bench]]
name = "page_preparation"
harness = false
