[package]
name = "raikiri-dom"
version = "0.2.0"
description = "DOM data model + taffy block layout and shodo inline layout engine + PageStream/LayoutBuffer + GCPM runtime side (PageContext, TargetRegistry, PageBoxCache) for raikiri"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
logical-snapshot = []
snapshot-serde = ["logical-snapshot", "dep:serde"]

[dependencies]
serde = { version = "1", features = ["derive"], optional = true }
bitflags       = "2"
shodo          = { workspace = true }
skrifa         = { workspace = true }
raikiri-style  = { workspace = true }
raikiri-traits = { workspace = true }
rayon          = "1.8"
smol_str       = { workspace = true }
stacker        = { workspace = true }
taffy          = { workspace = true }
wuff           = { workspace = true }
url            = { workspace = true }

[dev-dependencies]
serde_json = "1"
criterion = { workspace = true }
raikiri-html = { workspace = true }
raikiri-style = { workspace = true }
tempfile = { workspace = true }

[lints]
workspace = true

[[bench]]
name = "layout"
harness = false

[[bench]]
name = "mutation"
harness = false

[[bench]]
name = "pipeline"
harness = false
