[package]
name = "raikiri-style-macros"
version = "0.1.0"
description = "Procedural macros that declare raikiri-style's CSS longhand properties from a table (internal to raikiri-style)"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
proc-macro = true

[dependencies]
# The expansion names raikiri-style's own items (`crate::property::..`),
# so the macros are only usable from inside raikiri-style.
syn         = { workspace = true }
quote       = { workspace = true }
proc-macro2 = { workspace = true }

[dev-dependencies]
# Snapshot tests of diagnostics and generated code.
insta       = { workspace = true }
# `span-locations` lets the unit tests render diagnostics with line and
# column, the way the compiler reports them.
proc-macro2 = { workspace = true, features = ["span-locations"] }
# The integration test expands the macro into code that parses with
# cssparser, as raikiri-style does.
cssparser   = { workspace = true }

[lints]
workspace = true
