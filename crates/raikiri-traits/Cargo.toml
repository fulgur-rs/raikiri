[package]
name = "raikiri-traits"
version = "0.2.0"
description = "Foundation traits and neutral model types for raikiri (RenderSink, ReplacedResolver, NetworkProvider, strategy traits, PageFragment/PageBox/PageContext, etc.)"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
# raikiri-style ownership of CascadeError (Stylo
# pattern). traits re-exports the enum back so `RenderError::Cascade(_)` and
# the umbrella `raikiri_traits::CascadeError` name path stay stable.
raikiri-style = { workspace = true }
smol_str      = { workspace = true }
bytes         = { workspace = true }
url           = { workspace = true }
rustc-hash    = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

# `io::safe_open`'s unix arm passes O_NOFOLLOW | O_NONBLOCK to the open
# syscall (crates/raikiri-traits/src/io.rs). Target-gated: non-unix builds
# never reference the crate, so they don't gain a dependency they never
# compile against.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[lints]
workspace = true
