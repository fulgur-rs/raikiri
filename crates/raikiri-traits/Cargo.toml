[package]
name = "raikiri-traits"
version = "0.2.0"
description = "Shared DOM, resource, layout, and target resolution contracts for raikiri"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
# raikiri-style ownership of CascadeError (Stylo
# pattern). traits re-exports the enum back so `RenderError::Cascade(_)` and
# the umbrella `raikiri_traits::CascadeError` name path stay stable.
raikiri-style = { workspace = true }
smol_str      = { workspace = true }
bytes         = { workspace = true }
url           = { workspace = true }
rustc-hash    = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

# `io::safe_open`'s unix arm passes O_NOFOLLOW | O_NONBLOCK to the open
# syscall (crates/raikiri-traits/src/io.rs). Target-gated: non-unix builds
# never reference the crate, so they don't gain a dependency they never
# compile against.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# `io::read_bounded_contained_file`'s Apple-platform arm resolves the opened
# descriptor's path with `fcntl(fd, F_GETPATH, ..)` via the safe
# `rustix::fs::getpath` wrapper (no `unsafe` in this crate). Target-gated to
# the same platform set as that `cfg` arm; `rustix::fs::getpath` is itself
# Apple-only. Default features (`std`, hence `alloc`) are load-bearing:
# `getpath` requires `alloc`, and the `Errno` -> `std::io::Error` conversion
# requires `std`, so do not add `default-features = false` without
# re-adding `std`.
[target.'cfg(any(target_os = "macos", target_os = "ios", target_os = "tvos", target_os = "watchos", target_os = "visionos"))'.dependencies]
rustix = { version = "1", features = ["fs"] }

[lints]
workspace = true
