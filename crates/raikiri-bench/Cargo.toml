[package]
name = "raikiri-bench"
version = "0.1.0"
description = "Rendering stage, throughput and memory benchmarks for raikiri"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
# Bench-only crate: no library surface, nothing here is ever published.
# Same posture as raikiri-vrt / raikiri-wpt (both `publish = false`).
publish = false

[dependencies]
# Regular (non-dev) dependency: this crate has no `src/lib.rs`, so the bench
# target is the only consumer, but `raikiri` is the "actual current rendering
# entry point" the harness measures rather than a throwaway/test-only
# fixture, hence `[dependencies]` over `[dev-dependencies]` — mirrors
# raikiri-wpt's own `raikiri = { workspace = true }` placement.
raikiri = { workspace = true }

[dev-dependencies]
# See root `Cargo.toml` `[workspace.dependencies]` `criterion` entry for the
# version pin + Pure Rust / WASM rationale (promoted there because
# raikiri-bench is the second crate to grow a bench target).
criterion = { workspace = true }
# The cascade_document bench and the cascade_memory test parse a report
# document and cascade it directly, without layout or painting.
raikiri-html = { workspace = true }
raikiri-style = { workspace = true }
triomphe = "0.1.16"
# Direct stage entry points and the real paint command recorder.
raikiri-dom = { workspace = true }
raikiri-paint = { workspace = true }
anyrender = { workspace = true }

[[bench]]
name = "fulgur_baseline"
harness = false

[[bench]]
name = "cascade_document"
harness = false

[[bench]]
name = "streaming_memory"
harness = false

[[bench]]
name = "pseudo_output_sharing"
harness = false

[[bench]]
name = "prepare_document"
harness = false

[[bench]]
name = "layout_document"
harness = false

[[bench]]
name = "pagination_document"
harness = false

[[bench]]
name = "paint_document"
harness = false

[[bench]]
name = "streaming_document"
harness = false

[lints]
workspace = true
