[package]
name = "raikiri-cascade-diff"
version = "0.1.0"
description = "Differential cascade checker: dumps canonicalized cascade results so two builds of raikiri-style can be compared"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

# `scripts/cascade-diff.sh` also builds this crate's sources outside the
# workspace, against the merge-base checkout of the path crates below, with a
# generated manifest. Keep that manifest's dependency list in step with this
# one: the same path crates, and the same version requirements for the others.
[dependencies]
raikiri-style = { workspace = true }
raikiri-html = { workspace = true }
raikiri-traits = { workspace = true }
bytes = { workspace = true }
url = { workspace = true }

[lints]
workspace = true
