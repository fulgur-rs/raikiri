[package]
name = "raikiri-net"
version = "0.1.1"
description = "NetworkProvider and ReplacedResolver implementations for raikiri, including SSRF-safe and trusted-system HTTP providers."
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
data-url       = { workspace = true }
image          = { workspace = true }
raikiri-traits = { workspace = true }
raikiri-svg     = { workspace = true }
url            = { workspace = true }
ureq           = { workspace = true, optional = true }

[dev-dependencies]
flate2   = { workspace = true }
png      = { workspace = true }
tempfile = { workspace = true }

[features]
# Off by default: `FileNetworkProvider`-only consumers (tests, examples)
# must not gain the `ureq`/`rustls`/`ring` dependency chain. See root
# Cargo.toml's `ureq` entry for the Pure-Rust/WASM rationale.
http-ureq = ["dep:ureq"]

[lints]
workspace = true
