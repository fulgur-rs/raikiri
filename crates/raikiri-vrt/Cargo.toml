[package]
name = "raikiri-vrt"
version = "0.1.0"
description = "VRT (visual regression testing) harness for raikiri: tiny-skia PNG encoder for anyrender pipelines"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
tiny-skia = { workspace = true }
png       = "0.17"                    # Direct dep for png::DecodingError in FixtureError; already transitive via tiny-skia so zero compile-time impact.

[dev-dependencies]
anyrender           = { workspace = true }
anyrender_vello_cpu = { workspace = true }
vello_cpu           = { workspace = true }  # m1.18 rayon thread-pin test only; production path stays anyrender-only.
peniko              = { workspace = true }
kurbo               = { workspace = true }
tempfile            = { workspace = true }  # Synthetic fixture dirs for reference-harness self-tests; workspace-centralized (root Cargo.toml declares tempfile = "3").

[lints]
workspace = true
