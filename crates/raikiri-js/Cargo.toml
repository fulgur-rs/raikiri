[package]
name = "raikiri-js"
version = "0.1.0"
description = "Boa JavaScript runtime and replaceable DOM host for WPT test scripts"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
raikiri-dom    = { workspace = true }
raikiri-style  = { workspace = true }
raikiri-traits = { workspace = true }
cssparser      = { workspace = true }
# default-features = false drops boa_engine's `temporal`/`intl` machinery
# (ICU, timezone data) this crate has no use for; `default-features = true`
# would also work but pulls in dependencies purely for API surface this
# crate never calls. `annex-b` is kept: ECMAScript Annex B (for example
# `String.prototype.substr` and HTML-like comments) is normative for web
# browsers, and web content such as WPT pages relies on it.
boa_engine = { version = "0.22", default-features = false, features = ["annex-b"] }
boa_gc = "0.22"
url = { workspace = true }

[features]
# Off by default: native builds and tests never need it. Exists so the
# Principle 5 (Pure Rust / WASM requirement) wasm32-unknown-unknown check has something
# to enable — boa_engine's own `js` feature is required for that target
# (see getrandom's wasm backend requirement), verified via:
#   rustup target add wasm32-unknown-unknown
#   cargo check -p raikiri-js --target wasm32-unknown-unknown --features wasm
wasm = ["boa_engine/js"]

[lints]
workspace = true
