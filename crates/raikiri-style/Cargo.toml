[package]
name = "raikiri-style"
version = "0.1.0"
description = "CSS engine for raikiri: cssparser + selectors integration, unified RuleTree (@page / counter / running / target-*), cascade → ComputedValues, GCPM static-side directive emit"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
# NB: this crate is the leaf of raikiri's Stylo-pattern DOM abstraction.
# Its consumers depend on it; it does not
# depend on any raikiri sub-crate. The reverse edge to the foundation
# crate exists in that crate's own Cargo.toml.
cssparser  = { workspace = true }
selectors  = { workspace = true }
smol_str   = { workspace = true }
rustc-hash = { workspace = true }

# `precomputed-hash` is a stylo-side implementation detail (`SelectorImpl`
# bounds Identifier/LocalName/NamespaceUrl on `PrecomputedHash`). It is
# intentionally NOT declared in `[workspace.dependencies]` — raikiri-style is
# the stylo-equivalent crate, so this dep is encapsulated here and hidden from
# the rest of the workspace. If a second crate ever legitimately needs it,
# promote to `[workspace.dependencies]` then.
precomputed-hash = "0.1"

[dev-dependencies]
# `criterion` backs `benches/cascade.rs` — the regression detector for the
# *per-declaration constant* of the cascade hot loop (a +22% regression
# that was invisible to both `cargo test` and `cargo clippy`).
#
# Promoted to `[workspace.dependencies]` once raikiri-bench legitimately
# grew a second `[[bench]]` target — the exact trigger anticipated here in
# advance — so the version pin, feature
# selection, and Pure Rust / WASM rationale (0.7.x vs 0.8+'s native `alloca.c`
# edge, wasm32 compile-but-doesn't-run status, gnuplot external-binary caveat)
# live once in the root manifest instead of drifting between crates. See root
# `Cargo.toml`'s `[workspace.dependencies]` `criterion` entry for the full
# writeup; nothing about raikiri-style's own bench semantics changed.
criterion = { workspace = true }

[[bench]]
name = "cascade"
harness = false

[lints]
workspace = true
