[package]
name = "raikiri-paint"
version = "0.1.0"
description = "PageFragment → anyrender::PaintScene walker for raikiri (VRT and debug output)"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
cssparser      = { workspace = true }
raikiri-traits = { workspace = true }
raikiri-dom    = { workspace = true }
raikiri-style  = { workspace = true }
raikiri-svg    = { workspace = true }
anyrender      = { workspace = true }
peniko         = { workspace = true }
kurbo          = { workspace = true }
parley         = { workspace = true }
taffy          = { workspace = true }
url            = { workspace = true }

[dev-dependencies]
taffy                = { workspace = true }
raikiri-html         = { workspace = true }
# Backs `benches/walk.rs` — the regression detector for `paint_document`'s
# per-element DFS walk (`crates/raikiri-paint/src/walk.rs`), the paint-side
# counterpart to `crates/raikiri-style/benches/cascade.rs`. Already promoted
# to `[workspace.dependencies]` (see root `Cargo.toml`'s `criterion` entry
# for the version pin + Pure Rust / WASM rationale — raikiri-paint is a
# third consumer, not a reason to re-litigate that decision).
criterion            = { workspace = true }
# Probe-only dependency (rasterizer memory/panic characterization) — real
# CPU rasterizer backend, not used by production code (production stays
# anyrender-backend-agnostic via the `PaintScene` trait, per this crate's
# module doc).
#
# 原則 5 Pure Rust / WASM check (package-boundary rule): this is not a new package in
# the dependency graph. `anyrender_vello_cpu` is already a workspace
# dependency consumed by `raikiri-vrt`, `raikiri`, and `raikiri-wpt`
# (`grep -rl anyrender_vello_cpu crates/*/Cargo.toml`), so adding this edge
# adds a single line to `Cargo.lock` (`raikiri-paint`'s own `dependencies`
# list gains one entry) and zero new `[[package]]` entries — verified via
# `git diff main -- Cargo.lock`. Whatever Pure-Rust/WASM posture this
# dependency already has for the existing consumers is unchanged by this dev-
# only edge; there is no new dep to evaluate.
anyrender_vello_cpu  = { workspace = true }

[[bench]]
name = "walk"
harness = false

[lints]
workspace = true
