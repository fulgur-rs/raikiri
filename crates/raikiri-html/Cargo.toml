[package]
name = "raikiri-html"
# Integration tests build as one binary (tests/all.rs) plus the [[test]]
# targets at the end of this file; see tests/all.rs.
autotests = false
version.workspace = true
description = "HTML document entry points for raikiri: html5ever parsing, cascade assembly, resource handoff, and the layout entry point returning an owned DocumentLayout"
readme = "README.md"
keywords = ["html", "css", "layout", "pagination", "paged-media"]
categories = ["web-programming", "rendering", "parser-implementations"]
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
streaming-diagnostics = []
cache-accounting-diagnostics = []
running-cache-diagnostics = []

[dependencies]
raikiri-traits = { workspace = true }
raikiri-dom    = { workspace = true }
raikiri-style  = { workspace = true }
cssparser      = { workspace = true }
shodo          = { workspace = true }
image          = { workspace = true }
raikiri-svg    = { workspace = true }
html5ever      = { workspace = true }
markup5ever    = { workspace = true }
xml5ever       = { workspace = true }
rustc-hash     = { workspace = true }
smol_str       = { workspace = true }
url            = { workspace = true }
data-url       = { workspace = true }
unicode-script = { workspace = true }
tempfile = { workspace = true }

[dev-dependencies]
criterion = { workspace = true }
bytes          = { workspace = true }
moxcms         = { workspace = true }

[lints]
workspace = true

[[bench]]
name = "parse"
harness = false

[[bench]]
name = "multi_page_layout"
harness = false

# One binary for the plain integration-test files (see tests/all.rs). The
# targets after it need a process of their own.
[[test]]
name = "all"
path = "tests/all.rs"

[[test]]
name = "fragment_budget_probe"
path = "tests/fragment_budget_probe.rs"

[[test]]
name = "collapsed_table_scaling"
path = "tests/collapsed_table_scaling.rs"

[[test]]
name = "multicol_scaling"
path = "tests/multicol_scaling.rs"
