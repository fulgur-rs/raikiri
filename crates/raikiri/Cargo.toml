[package]
name = "raikiri"
version = "0.2.0"
description = "Umbrella crate for raikiri: in-repo dogfooding APIs (html_to_png / PageScene / PageDrawables) and re-exports of all sub-crates"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
raikiri-traits = { workspace = true }
raikiri-style  = { workspace = true }
raikiri-net    = { workspace = true }
raikiri-dom    = { workspace = true }
raikiri-html   = { workspace = true }
raikiri-paint  = { workspace = true }
# Re-export `Url` so Consumers can name `raikiri::Url` when constructing
# `raikiri::ParseOptions { base_url: Some(Url::parse(...)), ... }` without
# adding `url` as a direct dep.
url            = { workspace = true }
# Re-export `Bytes` so `NetworkProvider` implementations can construct
# `FetchedResource.bytes` and `Body::Bytes(Bytes)`.
bytes          = { workspace = true }
# Raster pipeline for html_to_png (`render_to_buffer` in anyrender_vello_cpu).
anyrender           = { workspace = true }
anyrender_vello_cpu = { workspace = true }
# Used by encode_png (inlined from raikiri-vrt) for alpha demultiplication.
# reference::decode_png remains in raikiri-vrt, so both crates use tiny-skia.
tiny-skia           = { workspace = true }
# PNG serialization in encode_png. Called directly (rather than through
# `tiny_skia::Pixmap::encode_png`) to pick a faster DEFLATE setting and to
# avoid copying the raster buffer; see `page_scene::encode_png`.
png                 = { workspace = true }

[dev-dependencies]
cssparser   = { workspace = true }
# Used by the hello_world_vrt integration test. Because raikiri-vrt has
# publish=false, specify a path-only dev dependency rather than inherit the
# workspace pin (version = "0.1.0", path = ...). With workspace = true, the
# version would remain in the manifest after cargo publish strips the path,
# and crates.io resolution would fail. cargo publish strips path-only dev
# dependencies entirely.
raikiri-vrt = { path = "../raikiri-vrt" }
# Write PNGs to temporary files in the html_to_png_with_resolver test.
tempfile    = { workspace = true }

[lints]
workspace = true
