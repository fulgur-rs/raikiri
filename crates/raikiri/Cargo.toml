[package]
name = "raikiri"
version = "0.1.0"
description = "Umbrella crate for raikiri: primary consumer API (parse_html / plan / render_streaming / render_batch / html_to_png) and re-exports of all sub-crates"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
raikiri-traits = { workspace = true }
raikiri-style  = { workspace = true }
raikiri-net    = { workspace = true }
raikiri-dom    = { workspace = true }
raikiri-html   = { workspace = true }
raikiri-paint  = { workspace = true }
# Re-export `Url` so Consumers can name `raikiri::Url` when constructing
# `raikiri::ParseOptions { base_url: Some(Url::parse(...)), ... }` without
# adding `url` as a direct dep.
url            = { workspace = true }
# Re-export `Bytes` for `NetworkProvider` implementations: `FetchedResource`
# の `bytes` field と `Body::Bytes(Bytes)` の construction 用。
bytes          = { workspace = true }
# html_to_png: raster pipeline 用 (anyrender_vello_cpu で render_to_buffer)。
anyrender           = { workspace = true }
anyrender_vello_cpu = { workspace = true }
# encode_png 実装用 (raikiri-vrt から inline)。
# reference::decode_png は raikiri-vrt に残るため tiny-skia は両 crate で使う。
tiny-skia           = { workspace = true }
# html_to_png_with_fonts の FontContext 型。umbrella crate
# として `pub use parley::FontContext` を提供するため direct dep。
parley              = { workspace = true }

[dev-dependencies]
# hello_world_vrt integration test 用。raikiri-vrt は publish=false のため
# workspace pin (version = "0.1.0", path = ...) を継承せず path-only で指定する
# (workspace = true にすると version が manifest に残り、cargo publish 時に
#  path を strip した後 crates.io からの resolution が失敗するため)。
# path-only dev-dep は cargo publish 時に完全に strip される。
raikiri-vrt = { path = "../raikiri-vrt" }

[lints]
workspace = true
