[package]
name = "raikiri"
version = "0.1.0"
description = "Umbrella crate for raikiri: primary consumer API (parse_html / plan / render_streaming / render_batch / html_to_png) and re-exports of all sub-crates"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
raikiri-traits = { workspace = true }
raikiri-style  = { workspace = true }
raikiri-net    = { workspace = true }
raikiri-dom    = { workspace = true }
raikiri-html   = { workspace = true }
raikiri-paint  = { workspace = true }
# Re-export `Url` so Consumers can name `raikiri::Url` when constructing
# `raikiri::ParseOptions { base_url: Some(Url::parse(...)), ... }` without
# adding `url` as a direct dep (roborev-refine job 228, AC #6 完結).
url            = { workspace = true }
# Re-export `Bytes` for `NetworkProvider` implementations: `FetchedResource`
# の `bytes` field と `Body::Bytes(Bytes)` の construction 用 (roborev-refine
# job 230)。
bytes          = { workspace = true }
# m1.14 html_to_png: raster pipeline 用。raikiri-vrt は encode_png、
# anyrender/anyrender_vello_cpu は render_to_buffer + VelloCpuImageRenderer。
raikiri-vrt         = { workspace = true }
anyrender           = { workspace = true }
anyrender_vello_cpu = { workspace = true }
parley              = { workspace = true }

[lints]
workspace = true
